name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

# Permissions defined per-job to support fork pull requests safely
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Cache cloned repositories and dependencies
      uses: actions/cache@v4
      with:
        path: |
          ./repos
          ./deps
        key: ${{ runner.os }}-repos-deps-${{ hashFiles('generateReport.ts', 'users.json') }}
        restore-keys: |
          ${{ runner.os }}-repos-deps-

    - name: Cache emsdk
      uses: actions/cache@v4
      with:
        path: ./emsdk
        key: ${{ runner.os }}-emsdk-latest

    - name: Cache forks and built bots
      uses: actions/cache@v4
      with:
        path: |
          ./forks
          ./public/bots
        key: ${{ runner.os }}-forks-bots-${{ hashFiles('users.json') }}
        restore-keys: |
          ${{ runner.os }}-forks-bots-

    - name: Install dependencies
      run: npm ci

    # SDL/ImGui in the student repos need X11/GL dev headers to configure on Linux
    - name: Install system libraries for native bot builds
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake mesa-common-dev libgl1-mesa-dev \
          libx11-dev libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libxss-dev libxtst-dev libxext-dev libxfixes-dev libxkbcommon-dev \
          libxcb1-dev libx11-xcb-dev libwayland-dev libdecor-0-dev libasound2-dev \
          libpulse-dev libudev-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
          libusb-1.0-0-dev libxrender-dev libxkbcommon-x11-dev libdbus-1-dev libibus-1.0-dev

    # ccache: reuse compiled SDL2/ImGui/glm across the 21 fork builds
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-ccache
        max-size: 2G
        update-package-index: true

    - name: Generate competition report
      if: github.event_name != 'pull_request'
      # CMake reads these at configure time; step-scoped so the emscripten
      # WASM step below is unaffected.
      env:
        CMAKE_C_COMPILER_LAUNCHER: ccache
        CMAKE_CXX_COMPILER_LAUNCHER: ccache
      run: npm run report

    - name: Stub report for PR builds
      if: github.event_name == 'pull_request'
      run: node scripts/stub-report.mjs

    - name: Build bot WASM modules
      timeout-minutes: 30
      run: |
        if [ ! -d emsdk ]; then
          git clone https://github.com/emscripten-core/emsdk.git emsdk
        fi
        ./emsdk/emsdk install latest
        ./emsdk/emsdk activate latest
        source ./emsdk/emsdk_env.sh
        npm run build:bots

    - name: Build React application
      run: npm run build

    - name: Setup Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/configure-pages@v4
      with:
        enablement: true

    - name: Upload artifact
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
