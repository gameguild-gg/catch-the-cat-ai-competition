name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Cache cloned repositories and dependencies
      uses: actions/cache@v4
      with:
        path: |
          ./repos
          ./deps
        key: ${{ runner.os }}-repos-deps-${{ hashFiles('generateReport.ts', 'users.json') }}
        restore-keys: |
          ${{ runner.os }}-repos-deps-

    - name: Cache emsdk
      uses: actions/cache@v4
      with:
        path: ./emsdk
        key: ${{ runner.os }}-emsdk-latest

    - name: Cache forks and built bots
      uses: actions/cache@v4
      with:
        path: |
          ./forks
          ./public/bots
        key: ${{ runner.os }}-forks-bots-${{ hashFiles('users.json') }}
        restore-keys: |
          ${{ runner.os }}-forks-bots-

    - name: Install dependencies
      run: npm ci

    - name: Generate competition report
      if: github.event_name != 'pull_request'
      run: npm run report

    - name: Stub report for PR builds
      if: github.event_name == 'pull_request'
      run: node scripts/stub-report.mjs

    - name: Build bot WASM modules
      timeout-minutes: 30
      run: |
        if [ ! -d emsdk ]; then
          git clone https://github.com/emscripten-core/emsdk.git emsdk
        fi
        ./emsdk/emsdk install latest
        ./emsdk/emsdk activate latest
        source ./emsdk/emsdk_env.sh
        npm run build:bots

    - name: Build React application
      run: npm run build

    - name: Setup Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/configure-pages@v4
      with:
        enablement: true

    - name: Upload artifact
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      id: deployment
      uses: actions/deploy-pages@v4
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
